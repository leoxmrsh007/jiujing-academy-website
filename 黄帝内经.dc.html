<script>
class Component extends DCLogic {
  state = { lang: 'zh' };
  renderVals() {
    const lang = this.state.lang, en = lang === 'en';
    const cycle = { zh: 'hant', hant: 'en', en: 'zh' };
    const labels = { zh: '繁', hant: 'EN', en: '简' };
    return {
      rootClass: en ? 'lang-en' : (lang === 'hant' ? 'lang-hant' : ''),
      langLabel: labels[lang],
      toggleLang: () => this.setState((s) => ({ lang: cycle[s.lang] }))
    };
  }
  componentDidMount() {
    const els = document.querySelectorAll('[data-reveal]');
    if (!('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('seen')); return; }
    this._io = new IntersectionObserver((ents) => {
      ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('seen'); this._io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    els.forEach((e) => this._io.observe(e));
  }
  componentWillUnmount() { if (this._io) this._io.disconnect(); }
}
</script>
