<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九经书院 · 内容管理</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4efe4;
      color: #22201d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: #faf7ef;
      border: 1px solid rgba(34,32,29,.12);
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .logo { font-size: 36px; color: #9c2b23; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
    p { font-size: 14px; color: #8a857c; margin-bottom: 28px; line-height: 1.6; }
    input {
      width: 100%; padding: 14px 16px; font-size: 14px;
      border: 1px solid rgba(34,32,29,.18); background: #fff;
      outline: none; margin-bottom: 16px; box-sizing: border-box;
      transition: border-color .2s;
    }
    input:focus { border-color: #9c2b23; }
    button {
      width: 100%; padding: 14px; background: #22201d; color: #f4efe4;
      border: none; font-size: 15px; letter-spacing: 2px; cursor: pointer;
      transition: background .3s;
    }
    button:hover { background: #9c2b23; }
    .error { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; }
    .hint { font-size: 12px; color: #a89f90; margin-top: 20px; line-height: 1.7; }
    .hint a { color: #9c2b23; }
  </style>
</head>
<body>
  <div class="box" id="app">
    <div class="logo">九经</div>
    <h1>内容管理</h1>
    <p>输入 GitHub Token 登录后即可编辑</p>
    <input type="password" id="token" placeholder="粘贴 GitHub Token">
    <button id="btn" onclick="login()">登录</button>
    <div class="error" id="err">Token 无效，请重试</div>
    <div class="hint">
      没有 Token？
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=jiujing-cms" target="_blank">
        点此生成
      </a>
      <br>（只需勾选 repo 权限 → Generate token）
    </div>
  </div>

  <script>
    // 检查是否已有保存的 token
    const saved = localStorage.getItem('gh_token');
    if (saved) initCMS(saved);

    async function login() {
      const t = document.getElementById('token').value.trim();
      if (!t) return;
      document.getElementById('btn').disabled = true;
      document.getElementById('btn').textContent = '验证中...';

      try {
        const r = await fetch('https://api.github.com/user', {
          headers: { 'Authorization': 'token ' + t }
        });
        if (!r.ok) throw Error();
        localStorage.setItem('gh_token', t);
        initCMS(t);
      } catch(e) {
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = '登录';
        document.getElementById('err').style.display = 'block';
      }
    }

    function initCMS(token) {
      // 设置全局认证
      window.localStorage.setItem('gh_token', token);

      // 替换登录界面为 CMS
      document.getElementById('app').innerHTML = '<p style="padding:40px;color:#8a857c;">加载中...</p>';

      // 配置 CMS
      window.CMS_MANUAL_INIT = true;
      window.CMS_CONFIG = {
        backend: {
          name: 'github',
          repo: 'leoxmrsh007/jiujing-academy-website',
          branch: 'main'
        },
        media_folder: 'uploads',
        public_folder: '/uploads',
        locale: 'zh_Hans',
        collections: [
          {
            name: 'news',
            label: '书院动态',
            label_singular: '文章',
            folder: '_news',
            create: true,
            format: 'frontmatter',
            extension: 'md',
            slug: '{{year}}-{{month}}-{{slug}}',
            summary: '{{title}} - {{date}}',
            fields: [
              { label: '标题', name: 'title', widget: 'string' },
              { label: '日期', name: 'date', widget: 'string' },
              { label: '分类', name: 'cat', widget: 'select',
                options: ['seminar', 'lecture', 'journey', 'note', 'student'] },
              { label: '正文', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'writings',
            label: '学员感悟',
            label_singular: '感悟',
            folder: '_writings',
            create: true,
            format: 'frontmatter',
            extension: 'md',
            slug: '{{slug}}',
            summary: '{{author}} - {{date}}',
            fields: [
              { label: '姓名', name: 'author', widget: 'string' },
              { label: '日期', name: 'date', widget: 'string' },
              { label: '正文', name: 'body', widget: 'markdown' }
            ]
          }
        ]
      };

      // 加载 Decap CMS
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@3/dist/decap-cms.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
