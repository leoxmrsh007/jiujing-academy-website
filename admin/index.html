<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九经书院 · 内容管理</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4efe4; color: #22201d; min-height: 100vh;
    }
    .login { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:40px; }
    .login-box {
      background: #faf7ef; border:1px solid rgba(34,32,29,.12);
      padding:48px 40px; max-width:420px; width:90%; text-align:center;
    }
    .logo { font-size:36px; color:#9c2b23; margin-bottom:16px; }
    h1 { font-size:22px; font-weight:700; letter-spacing:2px; margin-bottom:8px; }
    p { font-size:14px; color:#8a857c; margin-bottom:28px; line-height:1.6; }
    input, textarea {
      width:100%; padding:12px 14px; font-size:14px; border:1px solid rgba(34,32,29,.18);
      background:#fff; outline:none; margin-bottom:12px; box-sizing:border-box;
      font-family: inherit; transition:border-color .2s;
    }
    input:focus, textarea:focus { border-color:#9c2b23; }
    button {
      padding:12px 28px; background:#22201d; color:#f4efe4;
      border:none; font-size:14px; letter-spacing:2px; cursor:pointer;
      transition:background .3s;
    }
    button:hover { background:#9c2b23; }
    button.sm { padding:8px 18px; font-size:12px; }
    button.sec { background:transparent; color:#22201d; border:1px solid rgba(34,32,29,.25); }
    button.sec:hover { background:#22201d; color:#f4efe4; }
    .header {
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 5vw; background:rgba(244,239,228,.92); backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(34,32,29,.1);
    }
    .content { max-width:1200px; margin:0 auto; padding:40px 5vw; }
    .card {
      background:#faf7ef; border:1px solid rgba(34,32,29,.09);
      padding:24px; margin-bottom:16px; cursor:pointer;
      transition:transform .2s, box-shadow .2s;
    }
    .card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(34,32,29,.06); }
    .tag {
      display:inline-block; padding:3px 10px; font-size:11px; letter-spacing:1px;
      background:#9c2b23; color:#f4efe4; margin-right:6px;
    }
    .toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:#22201d; color:#f4efe4; padding:12px 28px; font-size:14px;
      border-radius:4px; opacity:0; transition:opacity .3s; pointer-events:none;
      z-index:100;
    }
    .toast.show { opacity:1; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-size:13px; color:#55504a; margin-bottom:6px; }
    select {
      width:100%; padding:12px 14px; font-size:14px; border:1px solid rgba(34,32,29,.18);
      background:#fff; outline:none; margin-bottom:12px; font-family:inherit;
    }
    textarea { min-height:300px; line-height:1.7; resize:vertical; }
    .back { cursor:pointer; opacity:.7; }
    .back:hover { opacity:1; }
    .empty { text-align:center; padding:80px 0; color:#8a857c; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    const TOKEN_KEY = 'gh_token';
    const REPO = 'leoxmrsh007/jiujing-academy-website';
    const BRANCH = 'main';
    const API = 'https://api.github.com';

    // ── 状态管理 ──
    const state = { token: null, page: 'list', articles: [], editor: { title: '', date: '', cat: 'student', body: '', sha: null, path: '' } };

    // ── 工具函数 ──
    function $(id) { return document.getElementById(id); }
    function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    async function gh(url, opts = {}) {
      const r = await fetch(API + url, {
        ...opts,
        headers: { 'Authorization': 'token ' + state.token, 'Accept': 'application/vnd.github.v3+json', ...opts.headers }
      });
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || r.statusText); }
      return r.status === 204 ? null : r.json();
    }

    // ── 渲染 ──
    function render() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) return renderLogin();
      state.token = token;
      state.page === 'list' ? renderList() : renderEditor();
    }

    function renderLogin() {
      $('app').innerHTML = `
        <div class="login">
          <div class="login-box">
            <div class="logo">九经</div>
            <h1>内容管理</h1>
            <p>输入 GitHub Token 登录</p>
            <input type="password" id="tokenInput" placeholder="粘贴 GitHub Token">
            <button onclick="login()">登录</button>
            <p style="margin-top:16px;font-size:12px;color:#a89f90;">
              <a href="https://github.com/settings/tokens/new?scopes=repo&description=jiujing-cms" target="_blank" style="color:#9c2b23;">点此生成 Token</a>
              <br>（勾选 repo 权限 → Generate token）
            </p>
          </div>
        </div>
      `;
    }

    window.login = async function() {
      const token = $('tokenInput').value.trim();
      if (!token) return;
      try {
        const r = await fetch(API + '/user', { headers: { 'Authorization': 'token ' + token } });
        if (!r.ok) throw Error();
        localStorage.setItem(TOKEN_KEY, token);
        state.token = token;
        toast('登录成功');
        renderList();
      } catch(e) {
        toast('Token 无效');
      }
    };

    // ── 文章列表 ──
    async function renderList() {
      $('app').innerHTML = `
        <div class="header">
          <div style="display:flex;align-items:center;gap:12px;">
            <span style="background:#9c2b23;color:#f4efe4;padding:4px 10px;font-size:13px;letter-spacing:2px;">九经</span>
            <span style="font-size:16px;font-weight:600;letter-spacing:1px;">内容管理</span>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="sm sec" onclick="logout()">退出</button>
            <button class="sm" onclick="newArticle()">+ 新建</button>
          </div>
        </div>
        <div class="content">
          <div style="display:flex;gap:28px;margin-bottom:28px;flex-wrap:wrap;">
            <div><span style="font-size:28px;font-weight:700;" id="countNews">-</span><div style="font-size:12px;color:#8a857c;margin-top:4px;">动态</div></div>
            <div><span style="font-size:28px;font-weight:700;" id="countWriting">-</span><div style="font-size:12px;color:#8a857c;margin-top:4px;">感悟</div></div>
          </div>
          <div id="articles"><div class="empty">加载中...</div></div>
        </div>
      `;

      try {
        const files = await gh('/repos/' + REPO + '/contents/_news?ref=' + BRANCH);
        const list = document.getElementById('articles');
        list.innerHTML = '';

        if (!files || files.length === 0) {
          list.innerHTML = '<div class="empty">暂无文章，点击右上角「+ 新建」</div>';
          return;
        }

        let newsCount = 0, writingCount = 0;

        for (const f of files) {
          try {
            const content = await gh('/repos/' + REPO + '/contents/_news/' + f.name + '?ref=' + BRANCH);
            const decoded = atob(content.content);
            const title = (decoded.match(/title:\s*"?([^"\n]+)"?/) || ['', f.name])[1];
            const cat = (decoded.match(/cat:\s*"?([^"\n]+)"?/) || ['', ''])[1];
            const date = (decoded.match(/date:\s*"?([^"\n]+)"?/) || ['', ''])[1];
            const preview = decoded.split('---')[2]?.trim().slice(0, 80) || '';

            if (cat === 'student') writingCount++; else newsCount++;

            list.innerHTML += `
              <div class="card" onclick="editArticle('${f.name}')">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
                  <span class="tag">${cat || 'note'}</span>
                  <span style="font-size:12px;color:#8a857c;">${date || ''}</span>
                </div>
                <div style="font-size:17px;font-weight:600;letter-spacing:1px;">${title}</div>
                <div style="font-size:13px;color:#8a857c;margin-top:6px;">${preview}...</div>
              </div>
            `;
          } catch(e) { continue; }
        }

        document.getElementById('countNews').textContent = newsCount;
        document.getElementById('countWriting').textContent = writingCount;
      } catch(e) {
        document.getElementById('articles').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
      }
    }

    window.newArticle = function() {
      state.page = 'editor';
      state.editor = { title: '', date: new Date().toISOString().slice(0,7), cat: 'seminar', body: '', sha: null, path: '' };
      renderEditor();
    };

    window.editArticle = async function(filename) {
      try {
        const content = await gh('/repos/' + REPO + '/contents/_news/' + filename + '?ref=' + BRANCH);
        const decoded = atob(content.content);
        const parts = decoded.split('---');
        const frontmatter = parts[1] || '';
        const body = parts.slice(2).join('---').trim();
        const title = (frontmatter.match(/title:\s*"?([^"\n]+)"?/) || ['', ''])[1];
        const date = (frontmatter.match(/date:\s*"?([^"\n]+)"?/) || ['', ''])[1];
        const cat = (frontmatter.match(/cat:\s*"?([^"\n]+)"?/) || ['', ''])[1];

        state.page = 'editor';
        state.editor = { title, date, cat, body, sha: content.sha, path: filename };
        renderEditor();
      } catch(e) {
        toast('加载失败: ' + e.message);
      }
    };

    // ── 编辑器 ──
    function renderEditor() {
      const e = state.editor;
      $('app').innerHTML = `
        <div class="header">
          <div style="display:flex;align-items:center;gap:12px;">
            <span class="back" onclick="goBack()">&#8592;</span>
            <span style="font-size:16px;font-weight:600;letter-spacing:1px;">${e.sha ? '编辑文章' : '新建文章'}</span>
          </div>
          <button onclick="saveArticle()">${e.sha ? '更新' : '发布'}</button>
        </div>
        <div class="content" style="max-width:800px;">
          <div class="form-group">
            <label>标题</label>
            <input id="edTitle" value="${e.title}">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label>日期</label>
              <input id="edDate" value="${e.date}">
            </div>
            <div class="form-group">
              <label>分类</label>
              <select id="edCat">
                <option value="seminar" ${e.cat==='seminar'?'selected':''}>会讲</option>
                <option value="lecture" ${e.cat==='lecture'?'selected':''}>讲座</option>
                <option value="journey" ${e.cat==='journey'?'selected':''}>游学</option>
                <option value="note" ${e.cat==='note'?'selected':''}>札记</option>
                <option value="student" ${e.cat==='student'?'selected':''}>学员</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>正文 (Markdown)</label>
            <textarea id="edBody">${e.body}</textarea>
          </div>
        </div>
      `;
    }

    window.goBack = function() { state.page = 'list'; render(); };

    window.saveArticle = async function() {
      const title = $('edTitle').value.trim();
      const date = $('edDate').value.trim();
      const cat = $('edCat').value;
      const body = $('edBody').value;

      if (!title) { toast('请输入标题'); return; }

      const slug = title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '-').replace(/-+/g, '-').slice(0, 50);
      const filename = state.editor.path || (date.slice(0,4) + '-' + date.slice(5,7) + '-' + slug + '.md');
      const content = `---\ntitle: ${title}\ndate: "${date}"\ncat: "${cat}"\n---\n\n${body}\n`;

      const payload = {
        message: state.editor.sha ? '更新: ' + title : '新增: ' + title,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: BRANCH
      };
      if (state.editor.sha) payload.sha = state.editor.sha;

      try {
        await gh('/repos/' + REPO + '/contents/_news/' + filename, { method: 'PUT', body: JSON.stringify(payload) });
        toast(state.editor.sha ? '更新成功！网站将自动部署' : '发布成功！网站将自动部署');
        state.page = 'list';
        renderList();
      } catch(e) {
        toast('保存失败: ' + e.message);
      }
    };

    window.logout = function() {
      localStorage.removeItem(TOKEN_KEY);
      renderLogin();
    };

    // ── 启动 ──
    render();
  </script>
</body>
</html>
