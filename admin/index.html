<!DOCTYPE html>

<head>

  <title>九经书院 · 内容管理</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4efe4; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>

    // 如果登录出错，显示引导信息
    window.CMS_MANUAL_INIT = false;

      if (window.location.search.includes('error')) {
        alert('登录出错，请确保已正确配置 GitHub OAuth App。');
      }
    });
  </script>
